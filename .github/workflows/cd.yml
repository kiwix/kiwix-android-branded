name: CD

# Publication tags follow the convention:
#   <app>_<YYYY>.<MM>.<nn>   publication of a given ZIM
#   <app>                             legacy/manual publication
# where
# - <app> is the branded app folder name
# - <YYYY>.<MM> is the date suffix of the ZIM filename (YYYY-MM), optionally
#     followed by one or two lowercase letters when a title flavour is updated
#     several times in the same month (e.g. 2026.05, 2026.02a, 2026.05bc).
# - <nn> is the build number. It starts at 0 for the first publication of a given
#     content version and is incremented on every retry, so a failed build can
#     simply be retried with the next number.
#
# Legacy/manual releases still use the bare app folder name as the tag and
# remain supported.

on:
  release:
    types: [published]

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      app: ${{ steps.app.outputs.app }}
      is_new: ${{ steps.config.outputs.is_new }}
      upload_bundle: ${{ steps.config.outputs.upload_bundle }}
      revision: ${{ steps.config.outputs.revision }}
    steps:
      - name: Retrieving branded app configuration
        uses: actions/checkout@v4

      - name: Resolve app identifier from release tag
        id: app
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if [[ "$tag_name" =~ ^([a-z0-9_-]+)_[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            app="${BASH_REMATCH[1]}"
          else
            # Legacy/manual releases use the bare app folder name as the tag.
            app="$tag_name"
          fi
          if [[ ! "$app" =~ ^[a-z0-9_-]+$ ]]; then
            echo "::error::Invalid release tag '$tag_name'; expected <app>_YYYY.MM.<build> or a bare app name"
            exit 1
          fi
          if [ ! -d "$app" ]; then
            echo "::error::No branded app directory '$app' at release tag '$tag_name'"
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read app configuration
        id: config
        env:
          APP: ${{ steps.app.outputs.app }}
        run: |
          info="${APP}/info.json"
          if [ "$(jq -r '.deprecated // false' "$info")" = "true" ]; then
            echo "::error::This app is marked as deprecated in info.json. Publishing is not allowed."
            exit 1
          fi
          revision=$(jq -r '."kiwix-android_revision" // empty' "$info")
          if [ "$revision" = "latest" ]; then
            revision=""
          fi
          echo "is_new=$(jq -r '.new // false' "$info")" >> "$GITHUB_OUTPUT"
          echo "upload_bundle=$(jq -r '.upload_bundle // false' "$info")" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  # Normal publication: an app already registered and manually bootstrapped on
  # Google Play. Runs only when the app is not a first release.
  publish:
    needs: prepare
    if: needs.prepare.outputs.is_new != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.app }}
      REV_ID: ${{ needs.prepare.outputs.revision }}
      SHOULD_PUBLISH_BUNDLE: ${{ needs.prepare.outputs.upload_bundle }}
      APK_BUILD: ${{ needs.prepare.outputs.upload_bundle != 'true' && 'true' || '' }}
    steps:
      - name: Retrieving branded app configuration
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Retrieving Kiwix Android source code
        run: |
          if [ -z "$REV_ID" ]; then
            echo "Cloning latest commit from main branch"
            git clone --depth=1 --single-branch --branch main https://github.com/kiwix/kiwix-android.git
          else
            echo "Cloning specific commit: $REV_ID"
            git clone https://github.com/kiwix/kiwix-android.git
            git -C kiwix-android checkout "$REV_ID"
          fi

      - name: Copying branded app configuration into Kiwix Android code base
        run: ./copy_files_to_kiwix_android.sh

      - name: Set non-kiwix organization tag
        run: |
          non_kiwix_organization_tag="PLAYSTORE_JSON_${TAG^^}"
          echo "NON_KIWIX_ORGANIZATION_TAG=${non_kiwix_organization_tag}" >> $GITHUB_ENV

      - name: Preparing signing material
        env:
          keystore: ${{ secrets.keystore }}
          playstore_json: ${{ secrets.PLAYSTORE_JSON }}
          non_kiwix_organization_json: ${{ secrets[env.NON_KIWIX_ORGANIZATION_TAG] }}
        run: |
          echo "$keystore" | base64 -d > kiwix-android/kiwix-android.keystore
          if [ -n "$non_kiwix_organization_json" ]; then
            echo "$non_kiwix_organization_json" > kiwix-android/playstore.json
          else
            echo "$playstore_json" > kiwix-android/playstore.json
          fi

      - name: Publishing app to Google Play
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          DWDS_HTTP_BASIC_ACCESS_AUTHENTICATION: ${{ secrets.DWDS_HTTP_BASIC_ACCESS_AUTHENTICATION }}
        run: |
          cd kiwix-android
          if [ "$SHOULD_PUBLISH_BUNDLE" = "true" ]; then
            ./gradlew "publish${TAG^}ReleaseBundleWithPlayAssetDelivery"
          else
            ./gradlew "publish${TAG^}ReleaseApkWithExpansionFile"
          fi

  # First release: produce the dummy bundle to upload manually to Google Play.
  publish_dummy_bundle:
    needs: prepare
    if: needs.prepare.outputs.is_new == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.app }}
      REV_ID: ${{ needs.prepare.outputs.revision }}
    steps:
      - name: Retrieving branded app configuration
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Retrieving Kiwix Android source code
        run: |
          if [ -z "$REV_ID" ]; then
            echo "Cloning latest commit from main branch"
            git clone --depth=1 --single-branch --branch main https://github.com/kiwix/kiwix-android.git
          else
            echo "Cloning specific commit: $REV_ID"
            git clone https://github.com/kiwix/kiwix-android.git
            git -C kiwix-android checkout "$REV_ID"
          fi

      - name: Copying branded app configuration into Kiwix Android code base
        run: ./copy_files_to_kiwix_android.sh

      - name: Preparing signing material
        env:
          keystore: ${{ secrets.keystore }}
        run: |
          echo "$keystore" | base64 -d > kiwix-android/kiwix-android.keystore

      - name: Generate dummy Bundle
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          DWDS_HTTP_BASIC_ACCESS_AUTHENTICATION: ${{ secrets.DWDS_HTTP_BASIC_ACCESS_AUTHENTICATION }}
        run: |
          cd kiwix-android
          ./gradlew "bundle${TAG^}Release"

      - name: Get Bundle name and path
        id: bundle-path
        run: |
          BUNDLE_PATH="kiwix-android/branded/build/outputs/bundle/${TAG}Release/*${TAG}*.aab"
          BUNDLE_NAME="${TAG^}DummyBundle.aab"
          echo "bundle_path=$BUNDLE_PATH" >> $GITHUB_ENV
          echo "bundle_name=$BUNDLE_NAME" >> $GITHUB_ENV

      - name: Upload Bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.bundle_name }}
          path: ${{ env.bundle_path }}

  # Annotate the release when a publication actually failed.
  report_failure:
    needs: [prepare, publish, publish_dummy_bundle]
    if: >
      always() && (
        needs.prepare.result == 'failure' ||
        needs.publish.result == 'failure' ||
        needs.publish_dummy_bundle.result == 'failure'
      )
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Mark release as failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_name="${GITHUB_REF_NAME}"
          body="$(gh release view "$tag_name" --json body -q .body 2>/dev/null || true)"
          gh release edit "$tag_name" --notes "${body}

          > [!WARNING]
          > Build failed. See [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
